name: Deploy Atrium Web Edition to GitHub Pages

on:
  push:
    branches:
      - web-landing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Edition for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_WEB_DEMO: 'true'
        run: npm run build

      - name: Copy Atrium-Demo.mp4 into dist if present
        run: |
          if [ -f "Atrium-Demo.mp4" ]; then
            cp "Atrium-Demo.mp4" "dist/Atrium-Demo.mp4"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
