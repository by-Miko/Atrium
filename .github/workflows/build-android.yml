name: Build Android APK (Hardened Edition)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.6.*'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Clone official llama.cpp for Android NDK
        run: git clone --depth 1 --branch b4856 https://github.com/ggml-org/llama.cpp.git android/app/src/main/cpp/llama.cpp
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Official Atrium Release Keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ATRIUM_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ATRIUM_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ATRIUM_KEY_ALIAS }}
          KS_KPASS: ${{ secrets.ATRIUM_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > /tmp/atrium-release.jks
            echo "generated=false" >> $GITHUB_OUTPUT
          else
            keytool -genkeypair -v -keystore /tmp/atrium-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias atrium-miko -storepass "AtriumMiko2026Release" -keypass "AtriumMiko2026Release" -dname "CN=Miko, OU=Atrium, O=Atrium Project, L=Playa del Carmen, ST=Quintana Roo, C=MX"
            base64 -w 0 /tmp/atrium-release.jks > /tmp/atrium-release.jks.base64.txt
            echo "generated=true" >> $GITHUB_OUTPUT
          fi
      - name: Install dependencies & sync Capacitor
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npx cap sync android
      - name: Build Signed Release Android APK
        working-directory: android
        env:
          ATRIUM_KEYSTORE_PATH: /tmp/atrium-release.jks
          ATRIUM_KEYSTORE_PASSWORD: ${{ secrets.ATRIUM_KEYSTORE_PASSWORD || 'AtriumMiko2026Release' }}
          ATRIUM_KEY_ALIAS: ${{ secrets.ATRIUM_KEY_ALIAS || 'atrium-miko' }}
          ATRIUM_KEY_PASSWORD: ${{ secrets.ATRIUM_KEY_PASSWORD || 'AtriumMiko2026Release' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Atrium-Android-1.6.0.apk
      - name: Upload Signed Atrium Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Atrium-Android-1.6.0-Signed
          path: android/app/build/outputs/apk/release/Atrium-Android-1.6.0.apk
      - name: Backup Developer Keystore (First Run Only)
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Atrium-Developer-Keystore-BACKUP
          path: |
            /tmp/atrium-release.jks
            /tmp/atrium-release.jks.base64.txt